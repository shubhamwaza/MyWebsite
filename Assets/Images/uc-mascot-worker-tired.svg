  <path d="M147 84 Q155 89 163 84" stroke="#FBBE8E" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M115 74 Q125 79 135 75" stroke="#1C1917" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M145 75 Q155 79 165 74" stroke="#1C1917" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M128 117 Q140 112 152 117" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round" fill="none"/>

