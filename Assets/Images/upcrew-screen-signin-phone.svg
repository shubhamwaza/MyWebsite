  <!-- Slogan -->
  <text x="201" y="128" text-anchor="middle" class="txt" font-size="12" font-weight="500" fill="#64748B">Work that moves with you</text>

  <!-- Heading -->
  <text x="24" y="206" class="txt" font-size="27" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Welcome back</text>
  <text x="24" y="234" class="txt" font-size="13.5" font-weight="400" fill="#64748B">Sign in with the mobile number linked to your UpCrew</text>
  <text x="24" y="254" class="txt" font-size="13.5" font-weight="400" fill="#64748B">account.</text>

  <!-- Interactive Form Card with Concentric Geometry -->
  <g transform="translate(20, 282)">
    <rect width="362" height="200" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.03))"/>
    
    <!-- Mobile number label -->
    <text x="20" y="32" class="txt" font-size="12.5" font-weight="700" fill="#1E293B">Mobile number</text>

    <!-- Country Code Box with India Flag -->
    <rect x="20" y="46" width="82" height="50" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <!-- India Flag -->
    <g transform="translate(34, 63)">
      <rect width="20" height="4" fill="#FF9933" rx="1"/>
      <rect y="4" width="20" height="4" fill="#FFFFFF"/>
      <circle cx="10" cy="6" r="1.8" fill="#000080"/>
      <rect y="8" width="20" height="4" fill="#138808" rx="1"/>
    </g>
    <text x="60" y="77" class="txt" font-size="15" font-weight="700" fill="#0F172A">+91</text>

    <!-- Phone Number Input with Active Blue Focus Ring -->
    <rect x="110" y="46" width="232" height="50" rx="12" fill="#FFFFFF" stroke="#2558E8" stroke-width="2"/>
    <text x="126" y="77" class="txt" font-size="16" font-weight="600" fill="#0F172A" letter-spacing="0.5">98765 43210</text>

    <!-- Helper Text below input -->
    <text x="20" y="116" class="txt" font-size="11.5" font-weight="400" fill="#94A3B8">We'll send a one-time code to verify this number.</text>

    <!-- Soft + Strong Security Notice Pill -->
    <rect x="20" y="132" width="322" height="44" rx="10" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
    <!-- Checkmark icon -->
    <circle cx="36" cy="154" r="8" fill="#DBEAFE"/>
    <path d="M32.5 154 L35 156.5 L39.5 151.5" stroke="#2558E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="52" y="151" class="txt" font-size="11.5" font-weight="700" fill="#1E40AF">Secure sign-in</text>
    <text x="136" y="151" class="txt" font-size="11.5" font-weight="400" fill="#3B82F6">· Never shared with employers</text>
    <text x="52" y="166" class="txt" font-size="10.5" font-weight="400" fill="#60A5FA">Direct OTP gateway with bank-grade encryption</text>
  </g>

  <!-- Legal & Account Helper -->
  <text x="201" y="696" text-anchor="middle" class="txt" font-size="12" font-weight="500" fill="#64748B">New to UpCrew? We'll help you set up your profile.</text>
  <text x="201" y="720" text-anchor="middle" class="txt" font-size="10.5" font-weight="400" fill="#94A3B8">By continuing, you agree to UpCrew's Terms of Service and Privacy</text>
  <text x="201" y="736" text-anchor="middle" class="txt" font-size="10.5" font-weight="400" fill="#94A3B8">Policy.</text>

  <!-- Primary Action Button with Apple HIG 44px+ Touch Area (Height 52px) -->
  <rect x="20" y="762" width="362" height="52" rx="14" fill="#2558E8" filter="drop-shadow(0 4px 14px rgba(37, 88, 232, 0.3))"/>
  <text x="201" y="794" text-anchor="middle" class="txt" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="-0.2">Continue</text>

  <!-- Home Indicator Bar -->
  <rect x="134" y="860" width="134" height="5" rx="2.5" fill="#CBD5E1"/>
</svg>