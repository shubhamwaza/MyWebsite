  <path d="M130 176 L144 188 L160 176" stroke="#1D4ED8" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Neck -->
  <rect x="134" y="157" width="24" height="20" rx="9" fill="#FBBE8E"/>

