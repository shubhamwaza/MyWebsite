  ═══════════════════════════════════════════════ -->
  <!-- Radial burst lines from the clapping hands -->
  <g id="impact-burst">
    <!-- Starburst center -->
    <circle cx="260" cy="134" r="12" fill="#FDE047" opacity="0.8"/>
    <circle cx="260" cy="134" r="6" fill="#F59E0B"/>

    <!-- Radiating burst rays -->
    <path d="M260 110 L260 92" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M276 116 L290 102" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M244 116 L230 102" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M282 134 L300 134" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M238 134 L220 134" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M275 149 L288 160" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M245 149 L232 160" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Confetti and celebration particles -->
  <path d="M205 70 L208 76 L214 79 L208 82 L205 88 L202 82 L196 79 L202 76 Z" fill="#2558E8"/>
  <path d="M315 70 L318 76 L324 79 L318 82 L315 88 L312 82 L306 79 L312 76 Z" fill="#16A34A"/>
  <circle cx="218" cy="100" r="3.5" fill="#EF4444"/>
  <circle cx="302" cy="100" r="3.5" fill="#8B5CF6"/>
  <circle cx="260" cy="65" r="4" fill="#F59E0B"/>
  <circle cx="170" cy="140" r="3" fill="#10B981"/>
  <circle cx="350" cy="140" r="3" fill="#2558E8"/>
</svg>