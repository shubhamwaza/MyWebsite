  <rect x="68" y="184" width="28" height="66" rx="14" fill="#2558E8"/>
  <rect x="68" y="240" width="28" height="50" rx="14" fill="#2558E8"/>
  <circle cx="82" cy="293" r="16" fill="#FBBE8E"/>

