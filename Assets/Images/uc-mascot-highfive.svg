  <rect x="220" y="126" width="26" height="68" rx="13" fill="#1D4ED8" transform="rotate(-25 220 126)"/>
  <!-- Open palm meeting center -->
  <circle cx="254" cy="136" r="17" fill="#FBBE8E"/>
  <rect x="246" y="120" width="10" height="20" rx="5" fill="#FBBE8E"/>


