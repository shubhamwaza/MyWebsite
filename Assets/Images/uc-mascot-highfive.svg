  <rect x="368" y="157" width="24" height="20" rx="9" fill="#FBBE8E"/>

  <!-- Head -->
  <circle cx="378" cy="115" r="44" fill="#FBBE8E"/>

  <!-- Hair -->
  <path d="M336 100 Q340 72 378 70 Q416 72 420 100 Q408 83 378 82 Q348 83 336 100 Z" fill="#44403C"/>
  <path d="M336 100 Q332 113 337 135" stroke="#44403C" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M420 100 Q424 113 419 135" stroke="#44403C" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Face — Happy celebration -->
  <path d="M355 106 Q363 99 371 106" stroke="#1C1917" stroke-width="3.8" stroke-linecap="round" fill="none"/>
  <path d="M385 106 Q393 99 401 106" stroke="#1C1917" stroke-width="3.8" stroke-linecap="round" fill="none"/>
  <ellipse cx="354" cy="118" rx="8" ry="4.5" fill="#F472B6" opacity="0.4"/>
  <ellipse cx="402" cy="118" rx="8" ry="4.5" fill="#F472B6" opacity="0.4"/>
  <path d="M353 92 Q363 86 373 90" stroke="#44403C" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M383 90 Q393 86 403 92" stroke="#44403C" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M362 126 Q378 146 394 126 Z" fill="#FFFFFF" stroke="#1C1917" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Employer High-Five Left Arm (reaching up and left) -->
  <rect x="312" y="152" width="28" height="70" rx="14" fill="#C2410C" transform="rotate(40 312 152)"/>
  <rect x="280" y="126" width="26" height="68" rx="13" fill="#B03A0A" transform="rotate(25 280 126)"/>
