<svg viewBox="0 0 520 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UpCrew mascots — gig worker and employer celebrating with an energetic high five">
  <!-- Ground shadows -->
  <ellipse cx="140" cy="426" rx="66" ry="11" fill="#1C1917" opacity="0.07"/>
  <ellipse cx="380" cy="426" rx="66" ry="11" fill="#1C1917" opacity="0.07"/>

  <!-- ═══════════════════════════════════════════════
