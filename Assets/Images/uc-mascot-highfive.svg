  <rect x="338" y="380" width="46" height="24" rx="12" fill="#44403C"/>
  <rect x="388" y="380" width="46" height="24" rx="12" fill="#44403C"/>

  <!-- Legs -->
  <rect x="351" y="288" width="29" height="98" rx="14" fill="#78716C"/>
  <rect x="388" y="288" width="29" height="98" rx="14" fill="#78716C"/>

