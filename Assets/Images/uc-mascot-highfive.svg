  <ellipse cx="120" cy="118" rx="8" ry="4.5" fill="#F472B6" opacity="0.4"/>
  <ellipse cx="168" cy="118" rx="8" ry="4.5" fill="#F472B6" opacity="0.4"/>
  <path d="M119 92 Q129 86 139 90" stroke="#1C1917" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M149 90 Q159 86 169 92" stroke="#1C1917" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M128 126 Q144 146 160 126 Z" fill="#FFFFFF" stroke="#1C1917" stroke-width="2.5" stroke-linejoin="round"/>

