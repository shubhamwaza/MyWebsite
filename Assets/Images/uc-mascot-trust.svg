  <rect x="348" y="360" width="46" height="24" rx="12" fill="#44403C"/>
  <rect x="398" y="360" width="46" height="24" rx="12" fill="#44403C"/>

  <!-- Legs -->
  <rect x="361" y="268" width="29" height="98" rx="14" fill="#78716C"/>
  <rect x="398" y="268" width="29" height="98" rx="14" fill="#78716C"/>

  <!-- Body — coral polo shirt, leaning left toward center -->
  <path d="M336 170 Q324 176 320 192 L320 268 L452 268 L454 192 Q452 174 440 168 L418 156 Q405 151 388 151 Q371 151 358 156 Z" fill="#C2410C"/>
  <path d="M374 156 L388 168 L404 156" stroke="#B03A0A" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M360 170 Q358 210 360 248" stroke="#B03A0A" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Neck -->
