  <path d="M346 80 Q342 93 347 115" stroke="#44403C" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M430 80 Q434 93 429 115" stroke="#44403C" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Face — Reassured, satisfied smile -->
  <ellipse cx="373" cy="88" rx="8.5" ry="8" fill="#1C1917"/>
  <ellipse cx="403" cy="88" rx="8.5" ry="8" fill="#1C1917"/>
  <circle cx="371" cy="85" r="3" fill="white" opacity="0.5"/>
  <circle cx="401" cy="85" r="3" fill="white" opacity="0.5"/>
  <!-- Relaxed, happy eyebrows -->
  <path d="M363 72 Q373 68 382 72" stroke="#44403C" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M394 72 Q403 68 413 72" stroke="#44403C" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Genuine smile -->
  <path d="M375 113 Q388 123 401 113" stroke="#1C1917" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Left arm extended toward center phone -->
  <rect x="316" y="168" width="28" height="62" rx="14" fill="#C2410C"/>
  <rect x="290" y="210" width="58" height="26" rx="13" fill="#B03A0A"/>
  <!-- Hand gesturing at phone -->
  <circle cx="292" cy="223" r="15" fill="#FBBE8E"/>

  <!-- Right arm hanging relaxed -->
  <rect x="438" y="166" width="28" height="66" rx="14" fill="#C2410C"/>
  <rect x="438" y="222" width="28" height="50" rx="14" fill="#C2410C"/>
