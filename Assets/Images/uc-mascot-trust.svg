  <!-- ═══════════════════════════════════════════════
       THE TRUST ENGINE — Floating Glowing Escrow Phone
  ═══════════════════════════════════════════════ -->
  <!-- Ambient soft glow behind phone -->
  <rect x="200" y="125" width="120" height="190" rx="28" fill="#2558E8" opacity="0.12" filter="blur(16px)"/>
  <rect x="204" y="130" width="112" height="180" rx="24" fill="#10B981" opacity="0.08" filter="blur(12px)"/>

  <!-- Phone Body -->
  <g id="escrow-phone">
    <!-- Outer phone frame -->
    <rect x="210" y="135" width="100" height="170" rx="20" fill="#1C1917" stroke="#3D3935" stroke-width="2"/>
    <!-- Phone Screen -->
    <rect x="214" y="139" width="92" height="162" rx="16" fill="#FFFFFF"/>

    <!-- Screen Speaker Pill Notch -->
    <rect x="246" y="144" width="28" height="4" rx="2" fill="#E2E8F0"/>

    <!-- Escrow Card Inside Screen -->
    <rect x="220" y="156" width="80" height="88" rx="12" fill="#EEF2FF" stroke="#DBEAFE" stroke-width="1.5"/>

    <!-- Shield Icon in circle -->
    <circle cx="260" cy="178" r="14" fill="#2558E8"/>
    <path d="M255 178 L259 182 L266 174" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Badge text -->
    <text x="260" y="202" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui" font-weight="800" font-size="10" fill="#1C1917">₹1,200 LOCKED</text>
    <text x="260" y="214" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="600" font-size="7.5" fill="#2558E8">UPCREW ESCROW</text>

    <!-- Mini status row -->
    <rect x="228" y="222" width="64" height="14" rx="7" fill="#DCFCE7"/>
    <circle cx="236" cy="229" r="3" fill="#16A34A"/>
    <text x="244" y="232" font-family="'Space Grotesk',system-ui" font-weight="700" font-size="7" fill="#166534">Bank Guaranteed</text>

    <!-- OTP verification teaser -->
    <rect x="222" y="252" width="76" height="18" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="260" y="264" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-weight="700" font-size="8" fill="#475569">OTP: 4 8 2 1</text>

    <!-- Home bar -->
    <rect x="244" y="292" width="32" height="3" rx="1.5" fill="#CBD5E1"/>
  </g>

  <!-- Sparkles & Trust Nodes around Phone -->
  <!-- Top sparkle -->
  <path d="M260 108 L263 115 L270 118 L263 121 L260 128 L257 121 L250 118 L257 115 Z" fill="#2558E8"/>
  <circle cx="196" cy="150" r="3" fill="#10B981"/>
  <circle cx="324" cy="150" r="3" fill="#2558E8"/>
  <circle cx="260" cy="324" r="3" fill="#F59E0B"/>
</svg>