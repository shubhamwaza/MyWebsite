  <ellipse cx="150" cy="88" rx="8" ry="7.5" fill="#1C1917"/>
  <circle cx="118" cy="85" r="2.8" fill="white" opacity="0.55"/>
  <circle cx="148" cy="85" r="2.8" fill="white" opacity="0.55"/>
  <!-- Friendly eyebrows -->
