  <path d="M82 170 Q70 176 68 192 L72 268 L204 268 L202 192 Q198 174 186 168 L164 156 Q151 151 134 151 Q117 151 104 156 Z" fill="#2558E8"/>
  <path d="M106 172 Q108 212 110 248" stroke="#1D4ED8" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M120 156 L134 168 L150 156" stroke="#1D4ED8" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Neck -->
  <rect x="124" y="137" width="24" height="20" rx="9" fill="#FBBE8E"/>

