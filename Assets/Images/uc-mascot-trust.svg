  <path d="M142 73 Q150 70 160 74" stroke="#1C1917" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Warm upturned smile -->
  <path d="M122 113 Q134 123 146 113" stroke="#1C1917" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Left arm hanging relaxed -->
  <rect x="58" y="166" width="28" height="66" rx="14" fill="#2558E8"/>
  <rect x="58" y="222" width="28" height="50" rx="14" fill="#2558E8"/>
  <circle cx="72" cy="275" r="16" fill="#FBBE8E"/>

