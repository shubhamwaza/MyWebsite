  <path d="M90 76 Q86 90 91 112" stroke="#1C1917" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M178 76 Q182 90 177 112" stroke="#1C1917" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M124 50 Q128 40 134 48 Q140 40 144 50" stroke="#1C1917" stroke-width="5" stroke-linecap="round" fill="none"/>

