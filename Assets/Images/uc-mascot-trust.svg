  <rect x="138" y="360" width="46" height="24" rx="12" fill="#1C1917"/>

  <!-- Legs -->
  <rect x="101" y="268" width="29" height="98" rx="14" fill="#3D3935"/>
  <rect x="138" y="268" width="29" height="98" rx="14" fill="#3D3935"/>

